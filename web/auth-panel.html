<dialog id="account-dialog" aria-labelledby="account-title">
 <button id="close-account" type="button" aria-label="Fechar minha conta">Fechar ×</button>
 <section class="account-panel">
 <h2 id="account-title">Seu espaço na Aurora</h2>
 <p id="account-status" role="status">Verificando sessão…</p>
 <form id="auth-form">
  <div class="auth-fields">
   <div><label for="auth-email">E-mail</label><input id="auth-email" type="email" autocomplete="email" required maxlength="254"></div>
   <div><label for="auth-password">Senha</label><input id="auth-password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"></div>
  </div>
  <div class="actions"><button id="sign-in" type="submit">Entrar</button><button id="sign-up" type="button">Criar conta de estudo</button></div>
  <p class="auth-help">Use uma senha exclusiva para este laboratório. O cadastro pode exigir confirmação por e-mail. Neste laboratório, a disponibilidade de cadastro depende das configurações de e-mail do ambiente.</p>
 </form>
 <button id="sign-out" hidden>Sair da conta</button>
 <p id="auth-message" role="status" style="white-space:pre-wrap"></p>
 </section>
</dialog>
